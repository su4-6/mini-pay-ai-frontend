name: yshop-h5-production

services:
  food-web:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
    image: yshop-food-web:production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FOOD_WEB_HOST_PORT:-14173}:8080"
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 10

networks:
  backend:
    external: true
    name: minipay_default
