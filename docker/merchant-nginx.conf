server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Keep browser API calls same-origin and relay them over the private Compose
    # network. No backend service needs a public port for the merchant portal.
    location /api/ {
        proxy_pass http://management-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /oauth2/ { proxy_pass http://management-bff:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /login/oauth2/ { proxy_pass http://management-bff:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /logout { proxy_pass http://management-bff:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /switch-login { proxy_pass http://management-bff:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
