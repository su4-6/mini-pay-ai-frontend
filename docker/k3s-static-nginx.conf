server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 外壳必须每次校验。若浏览器留着旧的 index.html，就会一直请求旧的
    # 内容哈希 bundle，而下面的 immutable 会把它们锁 7 天 —— 于是服务端修好了，
    # 用户却永久卡在启动页。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
